id = "jwarykowski.herdr-zsa-lights"
name = "ZSA lights"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Agent status on a ZSA keyboard: number key N lights when workspace N's agent is blocked or done, plus a jump-to-waiting-agent action"
platforms = ["linux", "macos"]

# keep the watcher running for the session; it exits when herdr stops
[[startup]]
command = ["bin/watch", "start"]

[[actions]]
id = "next-agent"
title = "ZSA lights: focus the agent that needs you"
command = ["bin/next-agent"]

[[actions]]
id = "toggle"
title = "ZSA lights: toggle keyboard lights"
command = ["bin/watch", "toggle"]

[[actions]]
id = "restart"
title = "ZSA lights: restart watcher (after config changes)"
command = ["sh", "-c", "bin/watch stop; bin/watch start"]
